$projectBuilding:

  $commonSettings:

    $selectiveExecutions:

      Distributable:
        $tasksAndSourceFilesSelection:
          $ECMA_ScriptLogicProcessing: [ Common, Client, Server ]


  $ECMA_ScriptLogicProcessing:

    $preprocessorVariablesDefinitions__EXPERIMENTAL: ECMAScriptPreprocessorVariables.yaml

    $entryPointsGroups:

      Common:

        $singleEntryPointSourceFileRelativePath: Source/index.ts

        $targetRuntime:
          $type: BROWSER

        $distributing:
          $exposingOfExportsFromEntryPoints:
            $mustExpose: true
          $typeScriptTypesDeclarations:
            $mustGenerate: true

        $buildingModeDependent:

          $production:
            $outputTopDirectoryRelativePath: ""
            $revisioning: { $disable: true }

      Client:

        $singleEntryPointSourceFileRelativePath: Source/client.ts

        $targetRuntime:
          $type: BROWSER

        $distributing:
          $exposingOfExportsFromEntryPoints:
            $mustExpose: true
          $typeScriptTypesDeclarations:
            $mustGenerate: true

        $buildingModeDependent:

          $production:
            $outputTopDirectoryRelativePath: ""
            $revisioning: { $disable: true }

      Server:

        $singleEntryPointSourceFileRelativePath: Source/server.ts

        $targetRuntime:
          $type: NODEJS
          $minimalVersion:
            $major: 22
            $minor: 14

        $preprocessorVariables:
          __IS_UNIVERSAL__YDUR__: true
          __IS_CSR__YDUR__: false
          __IS_SSR__YDUR__: true

        $distributing:
          $exposingOfExportsFromEntryPoints:
            $mustExpose: true
#          $typeScriptTypesDeclarations:
#            $mustGenerate: true

        $buildingModeDependent:
          $production: { $outputTopDirectoryRelativePath: "" }
